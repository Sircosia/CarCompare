
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans, sans-serif); }

.app { padding: 1rem 0; }

.filter-bar {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem;
  align-items: center;
}
.filter-label {
  font-size: 12px; color: var(--color-text-secondary); font-weight: 500;
  margin-right: 4px; min-width: 60px;
}
.pill {
  font-size: 12px; padding: 4px 10px; border-radius: 20px; cursor: pointer;
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-background-secondary);
  color: var(--color-text-secondary);
  transition: all 0.15s;
  user-select: none;
}
.pill.active {
  background: var(--color-background-info);
  border-color: var(--color-border-info);
  color: var(--color-text-info);
  font-weight: 500;
}
.pill:hover { border-color: var(--color-border-primary); }

.separator { width: 1px; height: 24px; background: var(--color-border-tertiary); margin: 0 4px; }

.pan-area {
  position: relative;
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  min-height: 420px;
  overflow: visible;
  margin-bottom: 1.5rem;
}

.pan-img-zone {
  width: 100%; min-height: 400px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}

.pan-placeholder {
  width: 100%; min-height: 380px;
  position: relative;
  overflow: visible;
}

.bubble {
  position: absolute;
  background: var(--color-background-primary);
  border: 1px solid var(--color-border-secondary);
  border-radius: var(--border-radius-lg);
  padding: 6px 10px;
  font-size: 11px;
  min-width: 110px;
  max-width: 150px;
  cursor: pointer;
  transition: all 0.15s;
  z-index: 10;
  box-shadow: none;
}
.bubble.hidden { opacity: 0.12; pointer-events: none; }
.bubble.highlighted {
  border-color: var(--color-border-info);
  background: var(--color-background-info);
  z-index: 20;
}
.bubble .wire-code {
  font-size: 10px; font-weight: 500; letter-spacing: 0.03em;
  margin-bottom: 2px;
}
.bubble .wire-desc {
  font-size: 10px; color: var(--color-text-secondary); line-height: 1.4;
}
.wire-swatch {
  display: inline-block; width: 10px; height: 10px;
  border-radius: 2px; margin-right: 4px;
  vertical-align: middle; border: 0.5px solid rgba(0,0,0,0.15);
}

.connector-dot {
  position: absolute;
  width: 10px; height: 10px;
  border-radius: 50%;
  border: 2px solid white;
  cursor: pointer;
  z-index: 15;
  transition: all 0.15s;
}
.connector-dot:hover { transform: scale(1.4); }
.connector-dot.hidden { opacity: 0.15; }
.connector-dot.highlighted { transform: scale(1.5); box-shadow: 0 0 0 3px var(--color-border-info); }

.legend {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 0.75rem;
}
.legend-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--color-text-secondary);
}

.wire-list {
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  overflow: hidden;
}
.wire-row {
  display: grid; grid-template-columns: 80px 1fr 2fr 1.2fr;
  padding: 8px 12px; font-size: 12px;
  border-bottom: 0.5px solid var(--color-border-tertiary);
  align-items: center; gap: 8px;
  transition: background 0.1s;
  cursor: pointer;
}
.wire-row:last-child { border-bottom: none; }
.wire-row:hover { background: var(--color-background-secondary); }
.wire-row.hidden { opacity: 0.25; }
.wire-row.highlighted { background: var(--color-background-info); }
.wire-row-header {
  font-size: 11px; font-weight: 500; color: var(--color-text-secondary);
  background: var(--color-background-secondary);
  padding: 6px 12px;
  display: grid; grid-template-columns: 80px 1fr 2fr 1.2fr; gap: 8px;
  border-bottom: 0.5px solid var(--color-border-tertiary);
}
.group-header {
  padding: 6px 12px; font-size: 11px; font-weight: 500;
  background: var(--color-background-tertiary);
  color: var(--color-text-secondary);
  border-bottom: 0.5px solid var(--color-border-tertiary);
  letter-spacing: 0.04em; text-transform: uppercase;
}

.section-title {
  font-size: 14px; font-weight: 500; color: var(--color-text-primary);
  margin: 1.5rem 0 0.75rem;
}

svg.pan-svg { width: 100%; height: 100%; }
</style>

  { id:'RW_brake',code:'R/W',    swatch:'#cc0000', swatchBorder:'#f0f0f0', component:'Brake switch',     func:'Brake light power in',                   harness:'lighting', group:'lights' },
  { id:'BO_brake',code:'B/O',    swatch:'#111111', swatchBorder:'#ff8800', component:'Brake switch',     func:'Brake lamp → taillight',                 harness:'lighting', group:'lights' },
  { id:'B_frame', code:'B',      swatch:'#111111', swatchBorder:'#555',    component:'Frame ground',     func:'Main frame ground point 1',              harness:'main',     group:'starting' },
  { id:'B_frame2',code:'B',      swatch:'#111111', swatchBorder:'#555',    component:'Frame ground',     func:'Main frame ground point 2',              harness:'main',     group:'starting' },
];

const GROUP_LABELS = {
  ignition: 'Ignition / CDI system',
  starting: 'Starting & battery',
  charging: 'Charging / stator',
  lights:   'Lighting',
  switches: 'Switches & controls',
  awd:      'AWD system',
  sensors:  'Sensors & auxiliary',
};

const HARNESS_LABELS = {
  main:     'Main harness',
  charging: 'Charging harness',
  ignition: 'Ignition harness',
  lighting: 'Lighting harness',
  awd:      'AWD harness',
};

let currentFilter = { type: 'all', value: null };
let activeWire = null;

function isVisible(wire) {
  if (currentFilter.type === 'all') return true;
  if (currentFilter.type === 'harness') return wire.harness === currentFilter.value;
  if (currentFilter.type === 'group') return wire.group === currentFilter.value;
  return true;
}

function setMode(type, value) {
  currentFilter = { type, value };
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  renderList();
  renderBubbles();
  updateDots();
}

function renderList() {
  const list = document.getElementById('wire-list');
  list.innerHTML = `<div class="wire-row-header">
    <span>Color code</span><span>Component</span><span>Function / destination</span><span>Harness / group</span>
  </div>`;

  const groups = {};
  WIRES.forEach(w => {
    if (!groups[w.group]) groups[w.group] = [];
    groups[w.group].push(w);
  });

  Object.keys(groups).forEach(gk => {
    const wires = groups[gk];
    const anyVisible = wires.some(w => isVisible(w));
    const div = document.createElement('div');
    div.className = 'group-header';
    div.style.opacity = anyVisible ? '1' : '0.3';
    div.textContent = GROUP_LABELS[gk] || gk;
    list.appendChild(div);

    wires.forEach(w => {
      const row = document.createElement('div');
      row.className = 'wire-row' + (isVisible(w) ? '' : ' hidden') + (activeWire === w.id ? ' highlighted' : '');
      row.innerHTML = `
        <span><span class="wire-swatch" style="background:${w.swatch};border-color:${w.swatchBorder}"></span><strong>${w.code}</strong></span>
        <span style="color:var(--color-text-primary)">${w.component}</span>
        <span style="color:var(--color-text-secondary);font-size:11px">${w.func}</span>
        <span style="color:var(--color-text-secondary);font-size:10px">${HARNESS_LABELS[w.harness] || w.harness}</span>
      `;
      row.onclick = () => selectWire(w.id);
      list.appendChild(row);
    });
  });
}

const BUBBLE_POSITIONS = {
  WL:       { x: 2, y: 5, anchor: 'right' },
  WR:       { x: 2, y: 14, anchor: 'right' },
  BR:       { x: 2, y: 23, anchor: 'right' },
  BW:       { x: 2, y: 32, anchor: 'right' },
  YBr:      { x: 2, y: 42, anchor: 'right' },
  YR:       { x: 2, y: 51, anchor: 'right' },
  BR_R:     { x: 2, y: 60, anchor: 'right' },
  RB:       { x: 28, y: 5, anchor: 'right' },
  R:        { x: 28, y: 14, anchor: 'right' },
  Br:       { x: 28, y: 23, anchor: 'right' },
  YR2:      { x: 28, y: 42, anchor: 'right' },
  YRY:      { x: 28, y: 51, anchor: 'right' },
  GY:       { x: 53, y: 5, anchor: 'right' },
  GW:       { x: 53, y: 14, anchor: 'right' },
  Br_hl:    { x: 53, y: 23, anchor: 'right' },
  GO:       { x: 53, y: 42, anchor: 'right' },
  RW_brake: { x: 53, y: 51, anchor: 'right' },
  BO_brake: { x: 53, y: 60, anchor: 'right' },
  RW_start: { x: 62, y: 5, anchor: 'left' },
  WR_start: { x: 62, y: 14, anchor: 'left' },
  WRR:      { x: 62, y: 23, anchor: 'left' },
  R_batt:   { x: 62, y: 42, anchor: 'left' },
  B_gnd:    { x: 62, y: 51, anchor: 'left' },
  Br_awd:   { x: 2, y: 70, anchor: 'right' },
  Gr:       { x: 2, y: 79, anchor: 'right' },
  RW_fan:   { x: 62, y: 70, anchor: 'left' },
  B_frame:  { x: 2, y: 88, anchor: 'right' },
  B_frame2: { x: 2, y: 94, anchor: 'right' },
};

function renderBubbles() {
  const container = document.getElementById('bubbles-container');
  container.innerHTML = '';
  const pan = document.getElementById('pan-area');
  const pw = pan.offsetWidth || 680;
  const ph = pan.offsetHeight || 420;

  WIRES.forEach(w => {
    const pos = BUBBLE_POSITIONS[w.id];
    if (!pos) return;

    const bub = document.createElement('div');
    bub.className = 'bubble' + (isVisible(w) ? '' : ' hidden') + (activeWire === w.id ? ' highlighted' : '');
    bub.style.pointerEvents = isVisible(w) ? 'auto' : 'none';

    const isLeft = pos.anchor === 'right';
    const leftPct = pos.x;
    const topPct = pos.y;

    bub.style.left = leftPct + '%';
    bub.style.top = topPct + '%';

    bub.innerHTML = `
      <div class="wire-code"><span class="wire-swatch" style="background:${w.swatch};border-color:${w.swatchBorder}"></span>${w.code}</div>
      <div class="wire-desc">${w.component}</div>
      <div class="wire-desc" style="color:var(--color-text-tertiary)">${w.func.substring(0,45)}${w.func.length>45?'…':''}</div>
    `;
    bub.onclick = () => selectWire(w.id);
    container.appendChild(bub);
  });
}

function updateDots() {
  document.querySelectorAll('.c-dot').forEach(dot => {
    const wid = dot.dataset.wire;
    const wire = WIRES.find(w => w.id === wid);
    if (!wire) return;
    dot.style.opacity = isVisible(wire) ? '1' : '0.15';
    dot.style.transform = activeWire === wid ? 'scale(1.6)' : 'scale(1)';
  });
}

function selectWire(id) {
  activeWire = activeWire === id ? null : id;
  renderList();
  renderBubbles();
  updateDots();
}

function renderLegend() {
  const legend = document.getElementById('legend');
  const seen = new Set();
  WIRES.forEach(w => {
    if (!seen.has(w.code)) {
      seen.add(w.code);
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="wire-swatch" style="background:${w.swatch};border-color:${w.swatchBorder}"></span><span>${w.code}</span>`;
      legend.appendChild(item);
    }
  });
}

renderList();
renderBubbles();
renderLegend();

document.querySelectorAll('.c-dot').forEach(dot => {
  dot.addEventListener('click', () => selectWire(dot.dataset.wire));
});
</script>
