  const mn5=Math.min(...all5),mx5=Math.max(...all5);
  return wd.map(r=>{
    const ps=mx===mn?50:Math.pow((mx-r.prix)/(mx-mn),0.75)*100;
    const km=r.km;
    const ks=km===0?85:km<10000?95:km<20000?88:km<35000?78:km<50000?65:km<70000?50:km<90000?32:18;
    const ds2=mx2===mn2?50:Math.pow((mx2-r.dy2)/(mx2-mn2),0.75)*100;
    const ds3=mx3===mn3?50:Math.pow((mx3-r.dy3)/(mx3-mn3),0.75)*100;
    const ds5=mx5===mn5?50:Math.pow((mx5-r.dy5)/(mx5-mn5),0.75)*100;
    return{...r,
      s2:Math.round((0.40*ps+0.25*ks+0.35*ds2)*10)/10,
      s3:Math.round((0.40*ps+0.25*ks+0.35*ds3)*10)/10,
      s5:Math.round((0.40*ps+0.25*ks+0.35*ds5)*10)/10};
  });
}
function verdict(s){
  if(s>=80)return["🏆 Excellent","#16A34A"];
  if(s>=65)return["✅ Bon deal","#22C55E"];
  if(s>=50)return["👍 Correct","#CA8A04"];
  if(s>=35)return["⚠️ Passable","#EA580C"];
  return["❌ À éviter","#DC2626"];
}
function scoreColor(s){if(s>=80)return"#16A34A";if(s>=65)return"#22C55E";if(s>=50)return"#EAB308";if(s>=35)return"#F97316";return"#EF4444";}
function fmt(n){return n?"$"+n.toLocaleString("fr-CA"):"—";}
function dealColor(d){
  if(!d)return["#333","#666"];
  if(d.includes("Great"))return["#052E16","#4ADE80"];
  if(d.includes("Good"))return["#063B1E","#22C55E"];
  if(d.includes("Fair"))return["#1C1400","#EAB308"];
  if(d.includes("High")||d.includes("Over"))return["#3B0A0A","#F87171"];
  return["#1A1A1A","#666"];
}

function EditCell({value,type="text",options,onChange,className=""}){
  if(options)return<select className={`editable ${className}`} value={value} onChange={e=>onChange(e.target.value)}>{options.map(o=><option key={o} value={o}>{o}</option>)}</select>;
  return<input className={`editable ${type==="number"?"num":""} ${className}`} type={type} value={value} onChange={e=>onChange(type==="number"?Number(e.target.value)||0:e.target.value)} min={type==="number"?0:undefined}/>;
}
function ScoreCell({score}){
  const color=scoreColor(score);
  return<div className="score-cell"><div className="score-bar-wrap"><div className="score-bar" style={{width:`${score}%`,background:color}}/></div><span className="score-num" style={{color}}>{score}</span></div>;
}

function App(){
  const [rows,setRows]=useState(__DATA__);
  const [sortBy,setSortBy]=useState("s2");
  const [sortDir,setSortDir]=useState("desc");
  const [filterSrc,setFilterSrc]=useState("Tous");
  const [filterProv,setFilterProv]=useState("Tous");
  const [scoreMode,setScoreMode]=useState("s2");
  const [showMethod,setShowMethod]=useState(false);
  const [nextId,setNextId]=useState(100);

  const scored=useMemo(()=>computeScores(rows),[rows]);
  const filtered=useMemo(()=>{
    let r=scored;
    if(filterSrc!=="Tous")r=r.filter(x=>x.src===filterSrc);
    if(filterProv!=="Tous")r=r.filter(x=>x.prov===filterProv);
    return r;
  },[scored,filterSrc,filterProv]);
  const sorted=useMemo(()=>[...filtered].sort((a,b)=>{
    let va=a[sortBy],vb=b[sortBy];
    if(typeof va==="string"){va=va.toLowerCase();vb=vb.toLowerCase();}
    return va<vb?(sortDir==="asc"?-1:1):va>vb?(sortDir==="asc"?1:-1):0;
  }),[filtered,sortBy,sortDir]);

  const handleSort=col=>{if(sortBy===col)setSortDir(d=>d==="asc"?"desc":"asc");else{setSortBy(col);setSortDir("desc");}};
  const updateRow=useCallback((id,field,val)=>setRows(prev=>prev.map(r=>r.id===id?{...r,[field]:val}:r)),[]);
  const deleteRow=id=>setRows(prev=>prev.filter(r=>r.id!==id));
  const addRow=()=>{setRows(prev=>[...prev,{id:nextId,src:"CarGurus.ca",annee:2022,trim:"Quadrifoglio AWD",cond:"Usagé",km:50000,prix:55000,coul:"",carb:"Essence",vendeur:"",ville:"",prov:"QC",deal:""}]);setNextId(n=>n+1);};

  const allPrix=scored.map(r=>r.prix);
  const avgPrix=Math.round(allPrix.reduce((a,b)=>a+b,0)/allPrix.length);
  const provs=["Tous",...new Set(rows.map(r=>r.prov).filter(Boolean))].sort();

  const Th=({col,children,cls=""})=>{
    const active=sortBy===col;
    const arrow=active?(sortDir==="asc"?"↑":"↓"):"↕";
    return<th className={`${cls} ${active?"sorted":""}`} onClick={()=>handleSort(col)}>{children} <span style={{opacity:active?1:0.4,color:active?"#27AE60":"inherit"}}>{arrow}</span></th>;
  };

  return<div>
    <div className="header">
      <div style={{display:"flex",alignItems:"center",gap:16}}>
        <div className="logo-badge">QV</div>
        <div><div className="header-title">ALFA ROMEO STELVIO QUADRIFOGLIO — SCORING DYNAMIQUE</div>
        <div className="header-sub">505 HP Ferrari V6 · Modifie n'importe quelle donnée → scores recalculés en temps réel</div></div>
      </div>
      <div className="header-stats">
        <div className="stat-pill"><div className="num">{rows.length}</div><div className="lbl">Annonces</div></div>
        <div className="stat-pill"><div className="num">{fmt(Math.min(...allPrix))}</div><div className="lbl">Prix min</div></div>
        <div className="stat-pill"><div className="num">{fmt(avgPrix)}</div><div className="lbl">Prix moy.</div></div>
        <div className="stat-pill"><div className="num">{fmt(Math.max(...allPrix))}</div><div className="lbl">Prix max</div></div>
      </div>
    </div>

    <div className="controls">
      <div className="ctrl-group"><label>Source</label>
        <select value={filterSrc} onChange={e=>setFilterSrc(e.target.value)}>{["Tous","CarGurus.ca","AutoTrader.ca"].map(o=><option key={o}>{o}</option>)}</select>
      </div>
      <div className="ctrl-group"><label>Province</label>
        <select value={filterProv} onChange={e=>setFilterProv(e.target.value)}>{provs.map(o=><option key={o}>{o}</option>)}</select>
      </div>
      <div className="sep"/>
      <div className="ctrl-group"><label>Trier par score</label>
        <select value={scoreMode} onChange={e=>{setScoreMode(e.target.value);setSortBy(e.target.value);setSortDir("desc");}}>
          <option value="s2">1-2 ans</option><option value="s3">2-3 ans</option><option value="s5">5+ ans</option>
        </select>
      </div>
      <div className="sep"/>
      <span style={{color:"var(--muted)",fontSize:11}}>Résultats: <strong style={{color:"var(--text)"}}>{sorted.length}</strong></span>
      <button className="btn-add" onClick={addRow}>+ Ajouter</button>
    </div>

    <div className="legend">
      <span style={{fontSize:11,color:"#333",textTransform:"uppercase",letterSpacing:1}}>Score:</span>
      {[["🏆 Excellent","#16A34A","80-100"],["✅ Bon deal","#22C55E","65-79"],["👍 Correct","#EAB308","50-64"],["⚠️ Passable","#F97316","35-49"],["❌ À éviter","#EF4444","0-34"]].map(([l,c,r])=>(
        <div key={l} className="legend-item"><span className="score-badge-mini" style={{background:c}}>{l}</span><span>{r}</span></div>
      ))}
      <div className="sep"/>
      <span style={{fontSize:11,color:"#3A5A3A"}}>Algo: 40% Prix marché + 25% Kilométrage + 35% Dépréciation annuelle | V6 biturbo 2.9L Ferrari 505hp</span>
    </div>

    <div className="table-wrap">
      <table>
        <thead><tr>
          <th className="th-id">Rang</th>
          <Th col="src" cls="th-info">Source</Th>
          <Th col="annee" cls="th-info">Année</Th>
          <Th col="km" cls="th-info">KM</Th>
          <Th col="coul" cls="th-info">Couleur</Th>
          <Th col="vendeur" cls="th-info">Vendeur</Th>
          <Th col="ville" cls="th-info">Ville</Th>
          <Th col="prov" cls="th-info">Prov.</Th>
          <Th col="deal" cls="th-info">Deal CG</Th>
          <Th col="prix" cls="th-price th-section-start">Prix ($)</Th>
          <Th col="rv2" cls="th-rev th-section-start">🔮 Revente 2ans</Th>
          <Th col="rv3" cls="th-rev">🔮 Revente 3ans</Th>
          <Th col="rv5" cls="th-rev">🔮 Revente 5ans</Th>
          <Th col="dy2" cls="th-depr th-section-start">💸 Dépr./an 2ans</Th>
          <Th col="dy3" cls="th-depr">💸 Dépr./an 3ans</Th>
          <Th col="dy5" cls="th-depr">💸 Dépr./an 5ans</Th>
          <Th col="s2" cls="th-score th-section-start">⭐ 1-2ans</Th>
          <Th col="s3" cls="th-score">⭐ 2-3ans</Th>
          <Th col="s5" cls="th-score">⭐ 5ans</Th>
          <th className="th-score">Verdict</th>
          <th style={{width:32}}></th>
        </tr></thead>
        <tbody>
          {sorted.map((r,idx)=>{
            const [vLabel,vColor]=verdict(r[scoreMode]);
            const rank=idx+1;
            const rf=r.src==="CarGurus.ca"?(idx%2===0?"#0D170D":"#0A130A"):(idx%2===0?"#0A1020":"#080D18");
            const [dbg,dfc]=dealColor(r.deal);
            return<tr key={r.id} style={{background:rf}}>
              <td className={`rank ${rank<=3?"top3":""}`}>{rank}</td>
              <td><EditCell value={r.src} options={["CarGurus.ca","AutoTrader.ca"]} onChange={v=>updateRow(r.id,"src",v)}/></td>
              <td><EditCell value={r.annee} type="number" onChange={v=>updateRow(r.id,"annee",v)}/></td>
              <td><EditCell value={r.km} type="number" onChange={v=>updateRow(r.id,"km",v)}/></td>
              <td><EditCell value={r.coul} onChange={v=>updateRow(r.id,"coul",v)}/></td>
              <td style={{minWidth:140}}><EditCell value={r.vendeur} onChange={v=>updateRow(r.id,"vendeur",v)}/></td>
              <td><EditCell value={r.ville} onChange={v=>updateRow(r.id,"ville",v)}/></td>
              <td><EditCell value={r.prov} onChange={v=>updateRow(r.id,"prov",v)}/></td>
              <td>{r.deal&&<span className="deal-badge" style={{background:dbg,color:dfc,border:`1px solid ${dfc}44`}}>{r.deal}</span>}</td>
              <td className="td-section-start">
                <EditCell value={r.prix} type="number" onChange={v=>updateRow(r.id,"prix",v)} className="num"/>
              </td>
              <td className="td-section-start price-cell resale">{fmt(r.rv2)}</td>
              <td className="price-cell resale">{fmt(r.rv3)}</td>
              <td className="price-cell resale">{fmt(r.rv5)}</td>
              <td className="td-section-start price-cell depr-ann">{fmt(Math.round(r.dy2))}/an</td>
              <td className="price-cell depr-ann">{fmt(Math.round(r.dy3))}/an</td>
              <td className="price-cell depr-ann">{fmt(Math.round(r.dy5))}/an</td>
              <td className="td-section-start"><ScoreCell score={r.s2}/></td>
              <td><ScoreCell score={r.s3}/></td>
              <td><ScoreCell score={r.s5}/></td>
              <td><span className="verdict" style={{background:vColor+"22",color:vColor,border:`1px solid ${vColor}44`}}>{vLabel}</span></td>
              <td><button className="btn-del" onClick={()=>deleteRow(r.id)} title="Supprimer">✕</button></td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>

    <div className="method-panel">
      <button className="method-toggle" onClick={()=>setShowMethod(s=>!s)}>
        <span>📋 Méthodologie — Stelvio Quadrifoglio (V6 Ferrari 505hp)</span>
        <span>{showMethod?"▲ Fermer":"▼ Voir le détail"}</span>
      </button>
      {showMethod&&<div className="method-body">
        <div className="method-section"><h4>Score (0-100)</h4><ul>
          <li><strong style={{color:"#60A5FA"}}>40%</strong> Prix dans l'échantillon (courbe convexe)</li>
          <li><strong style={{color:"#4ADE80"}}>25%</strong> Kilométrage: &lt;10k=95 / 20k=88 / 35k=78 / 50k=65 / 70k=50 / 90k+=18</li>
          <li><strong style={{color:"#C084FC"}}>35%</strong> Dépréciation annuelle normalisée sur l'échantillon</li>
        </ul></div>
        <div className="method-section"><h4>Dépréciation QV spécifique</h4><ul>
          <li>Taux base: an1=12%, an2=10%, an3=9%, an4=8%, an5=7%</li>
          <li>Plus bas que moyenne (V6 Ferrari rare → retient sa valeur)</li>
          <li>KM &gt;80k: +2.5%/an | &gt;60k: +1.5%/an | &lt;10k: -1.0%/an</li>
          <li>Véhicule &gt;6 ans: -1.0%/an (courbe aplatie)</li>
          <li>Plancher: 18% du prix d'achat</li>
        </ul></div>
        <div className="method-section"><h4>Note importante</h4><ul>
          <li>Le 2024 à $122k est le <strong>dernier QV produit au Canada</strong> — valeur collector potentielle non modélisée</li>
          <li>Scores relatifs à l'échantillon actuel</li>
          <li>Clique sur n'importe quelle cellule pour modifier</li>
        </ul></div>
      </div>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
