// ── SCORING ENGINE ─────────────────────────────────────────────────────────
const CURRENT_YEAR = 2026;
const BASE_DEPR = {1:0.14, 2:0.12, 3:0.10, 4:0.09, 5:0.08};
const NEW_SHOCK = 0.15;

function annualRate(yearNum, carb, km, trim) {
  let r = BASE_DEPR[yearNum] || 0.075;
  const cl = carb.toLowerCase();
  if (cl.includes("essence")) r -= 0.010;
  else if (cl.includes("phev") || cl.includes("hybride")) r += 0.015;
  if (km > 50000) r += 0.020;
  else if (km > 30000) r += 0.010;
  else if (km < 5000 && km > 0) r -= 0.010;
  const tl = trim.toLowerCase();
  if (["veloce","tributo","intensa"].some(t => tl.includes(t))) r -= 0.008;
  return Math.max(r, 0.05);
}

function forecastValue(prix, cond, annee, km, carb, trim, yearsOwned) {
  let val = prix;
  if (cond === "Neuf") val *= (1 - NEW_SHOCK);
  let kmP = km || 5000;
  for (let y = 1; y <= yearsOwned; y++) {
    const r = annualRate(y, carb, kmP, trim);
    kmP += 15000;
    val *= (1 - r);
  }
  return Math.max(Math.round(val), Math.round(prix * 0.15));
}

function computeScores(rows) {
  if (!rows.length) return [];
  const prices = rows.map(r => r.prix);
  const minP = Math.min(...prices), maxP = Math.max(...prices);

  // compute depreciation per year for each bucket first (for normalization)
  const withDepr = rows.map(r => {
    const rv2 = forecastValue(r.prix, r.cond, r.annee, r.km, r.carb, r.trim, 2);
    const rv3 = forecastValue(r.prix, r.cond, r.annee, r.km, r.carb, r.trim, 3);
    const rv5 = forecastValue(r.prix, r.cond, r.annee, r.km, r.carb, r.trim, 5);
    return {
      ...r, rv2, rv3, rv5,
      dep2: r.prix - rv2, dep3: r.prix - rv3, dep5: r.prix - rv5,
      dpy2: (r.prix - rv2)/2, dpy3: (r.prix - rv3)/3, dpy5: (r.prix - rv5)/5,
    };
  });

  const all2 = withDepr.map(r => r.dpy2);
  const all3 = withDepr.map(r => r.dpy3);
  const all5 = withDepr.map(r => r.dpy5);
  const mn2=Math.min(...all2),mx2=Math.max(...all2);
  const mn3=Math.min(...all3),mx3=Math.max(...all3);
  const mn5=Math.min(...all5),mx5=Math.max(...all5);

  return withDepr.map(r => {
    // price score
    const ps = maxP===minP ? 50 : Math.pow((maxP-r.prix)/(maxP-minP), 0.75)*100;
    // km score
    const km = r.km;
    const ks = km===0?85:km<5000?95:km<15000?88:km<25000?78:km<35000?68:km<45000?55:km<60000?40:25;
    // depr score
    const ds2 = mx2===mn2?50:Math.pow((mx2-r.dpy2)/(mx2-mn2),0.75)*100;
    const ds3 = mx3===mn3?50:Math.pow((mx3-r.dpy3)/(mx3-mn3),0.75)*100;
    const ds5 = mx5===mn5?50:Math.pow((mx5-r.dpy5)/(mx5-mn5),0.75)*100;
    const s2 = Math.round((0.40*ps + 0.25*ks + 0.35*ds2)*10)/10;
    const s3 = Math.round((0.40*ps + 0.25*ks + 0.35*ds3)*10)/10;
    const s5 = Math.round((0.40*ps + 0.25*ks + 0.35*ds5)*10)/10;
    return { ...r, score2:s2, score3:s3, score5:s5 };
  });
}

function verdict(s) {
  if (s>=80) return ["🏆 Excellent", "#16A34A"];
  if (s>=65) return ["✅ Bon deal",  "#22C55E"];
  if (s>=50) return ["👍 Correct",   "#CA8A04"];
  if (s>=35) return ["⚠️ Passable",  "#EA580C"];
  return ["❌ À éviter","#DC2626"];
}
function scoreColor(s) {
  if (s>=80) return "#16A34A";
  if (s>=65) return "#22C55E";
  if (s>=50) return "#EAB308";
  if (s>=35) return "#F97316";
  return "#EF4444";
}

function fmt(n) { return n ? "$"+n.toLocaleString('fr-CA') : "—"; }
function fmtKm(n) { return n>0 ? n.toLocaleString('fr-CA')+" km" : "N/D"; }

// ── EDITABLE CELL ──────────────────────────────────────────────────────────
function EditCell({value, type="text", options, onChange, className=""}) {
  if (options) return (
    <select className={`editable ${className}`} value={value} onChange={e=>onChange(e.target.value)}>
      {options.map(o=><option key={o} value={o}>{o}</option>)}
    </select>
  );
  return (
    <input
      className={`editable ${type==="number"?"num":""} ${className}`}
      type={type} value={value}
      onChange={e=>onChange(type==="number"?Number(e.target.value)||0:e.target.value)}
      min={type==="number"?0:undefined}
    />
  );
}

// ── SCORE CELL ─────────────────────────────────────────────────────────────
function ScoreCell({score}) {
  const color = scoreColor(score);
  return (
    <div className="score-cell">
      <div className="score-bar-wrap">
        <div className="score-bar" style={{width:`${score}%`, background:color}} />
      </div>
      <span className="score-num" style={{color}}>{score}</span>
    </div>
  );
}

// ── MAIN APP ───────────────────────────────────────────────────────────────
function App() {
  const [rows, setRows] = useState(INITIAL);
  const [sortBy, setSortBy] = useState("score2");
  const [sortDir, setSortDir] = useState("desc");
  const [filterSrc, setFilterSrc] = useState("Tous");
  const [filterCond, setFilterCond] = useState("Tous");
  const [scoreMode, setScoreMode] = useState("score2"); // which score to highlight
  const [showMethod, setShowMethod] = useState(false);
  const [nextId, setNextId] = useState(100);
  const [darkMode, setDarkMode] = useState(true);

  const scored = useMemo(() => computeScores(rows), [rows]);

  const filtered = useMemo(() => {
    let r = scored;
    if (filterSrc !== "Tous") r = r.filter(x => x.src === filterSrc);
    if (filterCond !== "Tous") r = r.filter(x => x.cond === filterCond);
    return r;
  }, [scored, filterSrc, filterCond]);

  const sorted = useMemo(() => {
    return [...filtered].sort((a,b) => {
      let va = a[sortBy], vb = b[sortBy];
      if (typeof va === "string") va = va.toLowerCase();
      if (typeof vb === "string") vb = vb.toLowerCase();
      if (va < vb) return sortDir==="asc"?-1:1;
      if (va > vb) return sortDir==="asc"?1:-1;
      return 0;
    });
  }, [filtered, sortBy, sortDir]);

  const handleSort = (col) => {
    if (sortBy === col) setSortDir(d => d==="asc"?"desc":"asc");
    else { setSortBy(col); setSortDir("desc"); }
  };

  const updateRow = useCallback((id, field, val) => {
    setRows(prev => prev.map(r => r.id===id ? {...r, [field]:val} : r));
  }, []);

  const deleteRow = (id) => setRows(prev => prev.filter(r => r.id!==id));

  const addRow = () => {
    const newId = Date.now();
    setRows(prev => [...prev, {
      id: newId, src:"CarGurus", annee:2024, trim:"Veloce eAWD",
      cond:"Usagé", km:0, prix:35000, coul:"", carb:"Hybride PHEV",
      vendeur:"", ville:"", prov:"QC"
    }]);
    setSortBy("s2");
    setSortDir("desc");
    setTimeout(() => {
      const rows = document.querySelectorAll("tbody tr");
      if(rows.length) rows[rows.length-1].scrollIntoView({behavior:"smooth", block:"center"});
    }, 100);
  };

  React.useEffect(() => {
    document.body.className = darkMode ? '' : 'light-mode';
  }, [darkMode]);

  const avgPrix = Math.round(scored.reduce((a,r)=>a+r.prix,0)/scored.length);
  const minPrix = Math.min(...scored.map(r=>r.prix));
  const maxPrix = Math.max(...scored.map(r=>r.prix));

  const Th = ({col, children, cls=""}) => {
    const active = sortBy===col;
    const arrow = active ? (sortDir==="asc"?"↑":"↓") : "↕";
    return (
      <th className={`${cls} ${active?"sorted":""}`} onClick={()=>handleSort(col)}>
        {children} <span className={`sort-arrow ${active?"active":""}`}>{arrow}</span>
      </th>
    );
  };

  return (
    <div>
      {/* HEADER */}
      <div className="header">
        <div className="header-left">
          <div className="logo-badge">AR</div>
          <div>
            <div className="header-title">ALFA ROMEO TONALE — SCORING DYNAMIQUE</div>
            <div className="header-sub">Modifie n'importe quelle donnée → scores recalculés automatiquement</div>
          </div>
        </div>
        <div className="header-stats">
          <button className="toggle-btn" onClick={() => setDarkMode(d => !d)}>
            {darkMode ? '☀️ Light' : '🌙 Dark'}
          </button>
          <div className="stat-pill"><div className="num">{rows.length}</div><div className="lbl">Annonces</div></div>
          <div className="stat-pill"><div className="num">{fmt(minPrix)}</div><div className="lbl">Prix min</div></div>
          <div className="stat-pill"><div className="num">{fmt(avgPrix)}</div><div className="lbl">Prix moy.</div></div>
          <div className="stat-pill"><div className="num">{fmt(maxPrix)}</div><div className="lbl">Prix max</div></div>
        </div>
      </div>

      {/* CONTROLS */}
      <div className="controls">
        <div className="ctrl-group">
          <label>Source</label>
          <select value={filterSrc} onChange={e=>setFilterSrc(e.target.value)}>
            {["Tous","CarGurus","AutoTrader"].map(o=><option key={o}>{o}</option>)}
          </select>
        </div>
        <div className="ctrl-group">
          <label>Condition</label>
          <select value={filterCond} onChange={e=>setFilterCond(e.target.value)}>
            {["Tous","Neuf","Usagé"].map(o=><option key={o}>{o}</option>)}
          </select>
        </div>
        <div className="sep"/>
        <div className="ctrl-group">
          <label>Trier par score</label>
          <select value={scoreMode} onChange={e=>{setScoreMode(e.target.value);setSortBy(e.target.value);setSortDir("desc");}}>
            <option value="score2">1-2 ans</option>
            <option value="score3">2-3 ans</option>
            <option value="score5">5+ ans</option>
          </select>
        </div>
        <div className="sep"/>
        <span style={{color:"var(--muted)",fontSize:11}}>Résultats: <strong style={{color:"var(--text)"}}>{sorted.length}</strong></span>
        <button className="btn-add" onClick={addRow}>+ Ajouter annonce</button>
      </div>

      {/* LEGEND */}
      <div className="legend">
        <span style={{fontSize:11,color:"#555",textTransform:"uppercase",letterSpacing:1}}>Score:</span>
        {[["🏆 Excellent","#16A34A","80-100"],["✅ Bon deal","#22C55E","65-79"],["👍 Correct","#EAB308","50-64"],["⚠️ Passable","#F97316","35-49"],["❌ À éviter","#EF4444","0-34"]].map(([l,c,r])=>(
          <div key={l} className="legend-item">
            <span className="score-badge-mini" style={{background:c}}>{l}</span>
            <span>{r}</span>
          </div>
        ))}
        <div className="sep"/>
        <div className="legend-item"><span style={{fontSize:11,color:"#555"}}>Algo:</span> <span style={{fontSize:11}}>40% Prix marché + 25% Kilométrage + 35% Dépréciation annuelle</span></div>
      </div>

      {/* TABLE */}
      <div className="table-wrap">
        <table>
          <thead>
            <tr>
              {/* Identity */}
              <th className="th-id">Rang</th>
              <Th col="src" cls="th-info">Source</Th>
              <Th col="annee" cls="th-info">Année</Th>
              <Th col="trim" cls="th-info">Trim</Th>
              <Th col="cond" cls="th-info">Cond.</Th>
              <Th col="km" cls="th-info">KM</Th>
              <Th col="coul" cls="th-info">Couleur</Th>
              <Th col="carb" cls="th-info">Carburant</Th>
              <Th col="ville" cls="th-info">Ville</Th>
              {/* Prix */}
              <Th col="prix" cls="th-price th-section-start">Prix achat</Th>
              {/* Forecasts */}
              <Th col="rv2" cls="th-rev th-section-start">🔮 Revente 2ans</Th>
              <Th col="rv3" cls="th-rev">🔮 Revente 3ans</Th>
              <Th col="rv5" cls="th-rev">🔮 Revente 5ans</Th>
              {/* Depr/an */}
              <Th col="dpy2" cls="th-depr th-section-start">💸 Dépr./an 2ans</Th>
              <Th col="dpy3" cls="th-depr">💸 Dépr./an 3ans</Th>
              <Th col="dpy5" cls="th-depr">💸 Dépr./an 5ans</Th>
              {/* Scores */}
              <Th col="score2" cls="th-score th-section-start">⭐ Score 1-2ans</Th>
              <Th col="score3" cls="th-score">⭐ Score 2-3ans</Th>
              <Th col="score5" cls="th-score">⭐ Score 5ans</Th>
              {/* Verdicts */}
              <th className="th-score">Verdict {scoreMode==="score2"?"1-2ans":scoreMode==="score3"?"2-3ans":"5ans"}</th>
              <th style={{width:36}}></th>
            </tr>
          </thead>
          <tbody>
            {sorted.map((r, idx) => {
              const [vLabel, vColor] = verdict(r[scoreMode]);
              const rank = idx+1;
              return (
                <tr key={r.id}>
                  <td className={`rank ${rank<=3?"top3":""}`}>{rank}</td>
                  <td>
                    <EditCell value={r.src} options={["CarGurus","AutoTrader"]} onChange={v=>updateRow(r.id,"src",v)} />
                  </td>
                  <td>
                    <EditCell value={r.annee} type="number" onChange={v=>updateRow(r.id,"annee",v)} />
                  </td>
                  <td style={{minWidth:160}}>
                    <EditCell value={r.trim} onChange={v=>updateRow(r.id,"trim",v)} />
                  </td>
                  <td>
                    <EditCell value={r.cond} options={["Neuf","Usagé"]} onChange={v=>updateRow(r.id,"cond",v)} />
                  </td>
                  <td>
                    <EditCell value={r.km} type="number" onChange={v=>updateRow(r.id,"km",v)} />
                  </td>
                  <td>
                    <EditCell value={r.coul} onChange={v=>updateRow(r.id,"coul",v)} />
                  </td>
                  <td>
                    <EditCell value={r.carb} options={["Hybride PHEV","Hybride eAWD","Hybride 1.3L","Hybride","Essence","Électrique"]} onChange={v=>updateRow(r.id,"carb",v)} />
                  </td>
                  <td>
                    <EditCell value={r.ville} onChange={v=>updateRow(r.id,"ville",v)} />
                  </td>
                  {/* PRIX — éditable */}
                  <td className="td-section-start">
                    <EditCell value={r.prix} type="number" onChange={v=>updateRow(r.id,"prix",v)} className="num" />
                  </td>
                  {/* FORECASTS — calculés */}
                  <td className="td-section-start price-cell resale">{fmt(r.rv2)}</td>
                  <td className="price-cell resale">{fmt(r.rv3)}</td>
                  <td className="price-cell resale">{fmt(r.rv5)}</td>
                  {/* DEPR PAR AN */}
                  <td className="td-section-start price-cell depr-ann">{fmt(Math.round(r.dpy2))}/an</td>
                  <td className="price-cell depr-ann">{fmt(Math.round(r.dpy3))}/an</td>
                  <td className="price-cell depr-ann">{fmt(Math.round(r.dpy5))}/an</td>
                  {/* SCORES */}
                  <td className="td-section-start"><ScoreCell score={r.score2} /></td>
                  <td><ScoreCell score={r.score3} /></td>
                  <td><ScoreCell score={r.score5} /></td>
                  {/* VERDICT */}
                  <td>
                    <span className="verdict" style={{background:vColor+"22",color:vColor,border:`1px solid ${vColor}44`}}>
                      {vLabel}
                    </span>
                  </td>
                  <td>
                    <button className="btn-del" onClick={()=>deleteRow(r.id)} title="Supprimer">✕</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* METHODOLOGY */}
      <div className="method-panel">
        <button className="method-toggle" onClick={()=>setShowMethod(s=>!s)}>
          <span>📋 Méthodologie de l'algorithme de scoring</span>
          <span>{showMethod?"▲ Fermer":"▼ Voir le détail"}</span>
        </button>
        {showMethod && (
          <div className="method-body">
            <div className="method-section">
              <h4>Composantes du score (0-100)</h4>
              <ul>
                <li><strong style={{color:"#60A5FA"}}>40%</strong> — Position prix dans l'échantillon<br/>Prix le plus bas = 100, plus haut = 0. Courbe convexe (^0.75) pour amplifier les extrêmes.</li>
                <li><strong style={{color:"#4ADE80"}}>25%</strong> — Kilométrage<br/>&lt;5k=95 / 15k=88 / 25k=78 / 35k=68 / 45k=55 / 60k+=25 pts</li>
                <li><strong style={{color:"#C084FC"}}>35%</strong> — Coût de dépréciation annuel<br/>Normalisé sur l'échantillon. Moins ça coûte par an, mieux c'est.</li>
              </ul>
            </div>
            <div className="method-section">
              <h4>Modèle de dépréciation</h4>
              <ul>
                <li>Taux de base: an1=14%, an2=12%, an3=10%, an4=9%, an5=8%</li>
                <li>Essence: -1.0%/an (plus stable)</li>
                <li>PHEV/Hybride: +1.5%/an (batterie, incertitude tech)</li>
                <li>KM &gt;50k: +2.0%/an | &gt;30k: +1.0%/an | &lt;5k: -1.0%/an</li>
                <li>Veloce/Tributo/Intensa: -0.8%/an (plus désirable)</li>
                <li>Neuf: choc -15% à l'achat immédiat</li>
                <li>Plancher: min 15% du prix d'achat</li>
              </ul>
            </div>
            <div className="method-section">
              <h4>Comment utiliser</h4>
              <ul>
                <li>Clique sur <strong>n'importe quelle cellule</strong> pour modifier (année, KM, prix, carburant…)</li>
                <li>Les scores et forecasts se <strong>recalculent instantanément</strong></li>
                <li>Change le <strong>tri par score</strong> selon ta durée de possession prévue</li>
                <li>Filtre par source ou condition avec les menus en haut</li>
                <li>Ajoute une annonce manquante avec <strong>+ Ajouter</strong></li>
              </ul>
            </div>
            <div className="method-section">
              <h4>Limites du modèle</h4>
              <ul>
                <li>Forecasts basés sur courbes historiques moyennes marché CA</li>
                <li>Ne tient pas compte de l'état mécanique réel</li>
                <li>Scores sont <strong>relatifs à l'échantillon</strong> — si tu retires des annonces, les scores changent</li>
                <li>KM=0 pour neuf → score km estimé à 85/100</li>
              </ul>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
